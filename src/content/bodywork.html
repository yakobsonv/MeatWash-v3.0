<!-- Тело /bodywork — ЗАГЛУШКА интегратора (05.11): один h1, герой по образцу /wrap (hero-c без фото)
     и пустой блок заявки, чтобы шла сборка. Страницу пишет исполнитель направления по скелету
     research/PLAN.md («Скелет страниц разделов»): цены — подстановкой prices, плашки работ — works,
     смежные направления — related, отзывы — reviews (список и примеры — шапка scripts/pages.mjs).
     Призывы — «Оставьте заявку»: button data-request data-request-category="bodywork" (контракт —
     docs/meat-auto/CONTRACTS.md, «Заявка»). Пометки «нужно от клиента» на этой странице допустимы.
     В комментариях фигурные скобки подстановок не писать. -->
<section class="hero-c section-hero" aria-labelledby="page-title">

</section>
